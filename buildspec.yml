version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - echo "Installing dependencies..."
      - npm install
  
  pre_build:
    commands:
      - echo "Running pre-build checks..."
      - echo "Skipping tests for now"
  
  build:
    commands:
      - echo "Build phase - preparing deployment package..."
      - echo "Build completed on `date`"
  
  post_build:
    commands:
      - echo "Creating deployment artifact..."
      - echo "Deployment package ready"

artifacts:
  files:
    - '**/*'
  exclude-paths:
    - node_modules/**
    - .git/**
    - .env
  name: BackendBuildArtifact