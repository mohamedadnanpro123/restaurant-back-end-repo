name: Deploy Production Backend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      
      - name: Create deployment package
        run: |
          zip -r deployment-${{ github.sha }}.zip . \
            -x "*.git*" \
            -x "node_modules/*" \
            -x ".github/*"
      
      - name: Upload to S3
        run: aws s3 cp deployment-${{ github.sha }}.zip s3://restaurant-github-deployments/backend/deployment-${{ github.sha }}.zip
      
      - name: Create CodeDeploy deployment
        run: |
          aws deploy create-deployment \
            --application-name restaurant-backend-app-dev \
            --deployment-group-name production-dg-restaurant-inplace \
            --s3-location bucket=restaurant-github-deployments,key=backend/deployment-${{ github.sha }}.zip,bundleType=zip \
            --description "GitHub Actions deployment - commit ${{ github.sha }}" \
            --region us-east-1
      
      - name: Deployment initiated
        run: |
          echo "✅ Deployment initiated successfully!"
          echo "🔍 Monitor at: https://console.aws.amazon.com/codesuite/codedeploy/deployments"