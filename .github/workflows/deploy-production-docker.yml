name: Deploy Production Backend (Docker)

on:
  push:
    branches:
      - main

env:
  ECR_REPOSITORY: 044941685774.dkr.ecr.us-east-1.amazonaws.com/restaurant-backend
  AWS_REGION: us-east-1
  

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region ${{ env.AWS_REGION }} | \
          docker login --username AWS --password-stdin ${{ env.ECR_REPOSITORY }}
      
      - name: Build Docker image
        run: |
          docker build -t restaurant-backend .
      
      - name: Tag Docker image
        run: |
          # Tag with latest
          docker tag restaurant-backend:latest ${{ env.ECR_REPOSITORY }}:latest
          # Tag with commit SHA for versioning
          docker tag restaurant-backend:latest ${{ env.ECR_REPOSITORY }}:${{ github.sha }}
      
      - name: Push Docker image to ECR
        run: |
          # Push both tags
          docker push ${{ env.ECR_REPOSITORY }}:latest
          docker push ${{ env.ECR_REPOSITORY }}:${{ github.sha }}
      
      - name: Force new ECS deployment
        run: |
          aws ecs update-service \
            --cluster restaurant-cluster \
            --service restaurant-service \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}
          
          echo "✅ ECS deployment triggered!"
          echo "🐳 Docker image tags pushed:"
          echo "   - ${{ env.ECR_REPOSITORY }}:latest"
          echo "   - ${{ env.ECR_REPOSITORY }}:${{ github.sha }}"